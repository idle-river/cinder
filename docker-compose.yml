services:
  client:
    build:
      context: .
      dockerfile: apps/client/Containerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

  migrate:
    build:
      context: .
      dockerfile: apps/server/Containerfile
    command: ["bun", "run", "db:push"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Containerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: amazon/aws-cli:2.36.44
    restart: "no"
    depends_on:
      - rustfs
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./rustfs-setup.sh:/rustfs-setup.sh:ro
    entrypoint: ["/bin/sh", "/rustfs-setup.sh"]

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    command: ["/data"]

volumes:
  postgres-data:
  rustfs-data:
